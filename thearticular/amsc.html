        const videoNames = rawVideoNames.map((name, index) => `${ index + 1 }/${ rawVideoNames.length } : ${ name }`);
        function resetVideo()
        {
            videoElement.pause();
            videoElement.currentTime = 0;
            videoElement.style.display = 'none';
        }
        async function playVideo(index)
        {
            resetVideo();
            document.getElementById('timeDisplay').style.display = 'none';
            document.getElementById('loadingText').style.display = 'block';
            videoElement.src = videoSources[index];
            videoElement.load();
            videoElement.style.display = 'block';
            videoElement.addEventListener('canplaythrough', function onCanPlay()
            {
                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('timeDisplay').style.display = 'block';
                videoElement.removeEventListener('canplaythrough', onCanPlay);
            });
            videoElement.play();
            currentIndex = index;
            videoSelector.value = currentIndex;
            updateSeekbar();
            processAudio(index);
            setupAudioSource(videoElement);
            equalize();
        }
        async function processAudio(index)
        {
            const source = videoSources[index];
            if (waveformCache[source])
            {
                drawWaveform(waveformCache[source]);
                return;
            }
            try
            {
                const audioData = await getAudioData(source);
                if (window.Worker)
                {
                    if (!worker)
                    {
                        const workerScript = `
                        self.onmessage = function (e) {
                            const { data, targetSamples } = e.data;
                            const sampleSize = Math.floor(data.length / targetSamples);
                            const downsampledData = new Float32Array(targetSamples);
                            for (let i = 0; i < targetSamples; i++) {
                            downsampledData[i] = Math.abs(data[i * sampleSize]);
                            }
                            self.postMessage({ downsampledData });
                        };
                        `;
                        const blob = new Blob([workerScript], { type: 'application/javascript' });
                        worker = new Worker(URL.createObjectURL(blob));
                    }
                    worker.onmessage = function (e)
                    {
                        waveformCache[source] = e.data.downsampledData;
                        drawWaveform(e.data.downsampledData);
                    };
                    worker.postMessage({ data: audioData, targetSamples: seekbar.offsetWidth });
                }
                else
                {
                    const downsampledData = downsample(audioData, seekbar.offsetWidth);
                    waveformCache[source] = downsampledData;
                    drawWaveform(downsampledData);
                }
            }
            catch (error)
            {
                console.error("Error processing audio data:", error);
            }
        }
        function updateVideoSelector()
        {
            videoSelector.innerHTML = '';
            videoSources.forEach((src, index) =>
            {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = videoNames[index];
                videoSelector.appendChild(option);
            });
        }
        function updateSeekbar()
        {
            const totalTimeElement = document.getElementById("totalTime");
            const currentTimeElement = document.getElementById("currentTime");
            function formatTime(seconds)
            {
                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${ minutes < 10 ? '0' + minutes : minutes }:${ secs < 10 ? '0' + secs : secs }`;
            }
            videoElement.addEventListener('loadedmetadata', function ()
            {
                totalTimeElement.textContent = formatTime(videoElement.duration);
            });
            let animationFrameScheduled = false;
            videoElement.ontimeupdate = function ()
            {
                if (!animationFrameScheduled)
                {
                    animationFrameScheduled = true;
                    requestAnimationFrame(() =>
                    {
                        const percentage = (videoElement.currentTime / videoElement.duration) * 100;
                        requestAnimationFrame(() =>
                        {
                            seekbarProgress.style.left = percentage + "%";
                            currentTimeElement.textContent = formatTime(videoElement.currentTime);
                        });
                        currentTimeElement.textContent = formatTime(videoElement.currentTime);
                        animationFrameScheduled = false;
                    });
                }
            };
            seekbar.addEventListener('click', function (e)
            {
                const rect = seekbar.getBoundingClientRect();
                const left = e.clientX - rect.left;
                const totalWidth = rect.width;
                const percentage = left / totalWidth;
                videoElement.currentTime = videoElement.duration * percentage;
                seekbarProgress.style.left = (percentage * 100) + "%";
            });
        }
        function setupAudioSource(video)
        {
            source = null;
            source = audioContext.createMediaElementSource(video);
            const panner = audioContext.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'linear';
            panner.refDistance = 1;
            source.connect(panner);
            panner.connect(analyser);
            analyser.connect(audioContext.destination);
            var gainDb = -40.0;
            var bandSplit = [360, 3600];
            var hBand = audioContext.createBiquadFilter();
            hBand.type = "lowshelf";
            hBand.frequency.value = bandSplit[0];
            hBand.gain.value = gainDb;
            var hInvert = audioContext.createGain();
            hInvert.gain.value = -1.0;
            var mBand = audioContext.createGain();
            var lBand = audioContext.createBiquadFilter();
            lBand.type = "highshelf";
            lBand.frequency.value = bandSplit[1];
            lBand.gain.value = gainDb;
            var lInvert = audioContext.createGain();
            lInvert.gain.value = -1.0;
            source.connect(lBand);
            source.connect(mBand);
            source.connect(hBand);
            hBand.connect(hInvert);
            lBand.connect(lInvert);
            hInvert.connect(mBand);
            lInvert.connect(mBand);
            var lGain = audioContext.createGain();
            var mGain = audioContext.createGain();
            var hGain = audioContext.createGain();
            lBand.connect(lGain);
            mBand.connect(mGain);
            hBand.connect(hGain);
            var sum = audioContext.createGain();
            lGain.connect(sum);
            mGain.connect(sum);
            hGain.connect(sum);
            sum.connect(audioContext.destination);
            video.audioNodes = { lGain: lGain, mGain: mGain, hGain: hGain };
            video.audioNodes.panner = panner;
        }
        function updateAmplitude()
        {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) { sum += dataArray[i]; }
            const averageAmplitude = sum / bufferLength / 2;
            draw(averageAmplitude);
        }
        function resizeCanvas()
        {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        function draw(amplitude)
        {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const baseRadius = 200;
            const numShapes = 12;
            const maxAmplitudeScale = 0.01;
            const transformedAmplitude = Math.pow(amplitude, 1);
            const scale = 1 + (transformedAmplitude * maxAmplitudeScale);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < numShapes; i++)
            {
                const layerRadius = baseRadius * (i + 1) * scale * 0.2;
                const numSegments = 6 + i * 2;
                ctx.beginPath();
                const shapeType = i % 5;
                if (shapeType === 0)
                {
                    ctx.arc(centerX, centerY, layerRadius, 0, 2 * Math.PI);
                }
                else if (shapeType === 1)
                {
                    for (let j = 0; j < numSegments; j++)
                    {
                        const angle = (j / numSegments) * 2 * Math.PI;
                        const x1 = centerX + layerRadius * Math.cos(angle);
                        const y1 = centerY + layerRadius * Math.sin(angle);
                        const controlAngle1 = angle + (Math.PI / numSegments) * 0.6;
                        const controlAngle2 = angle - (Math.PI / numSegments) * 0.6;
                        const controlRadius = layerRadius * 1.3;

                        const cx1 = centerX + controlRadius * Math.cos(controlAngle1);
                        const cy1 = centerY + controlRadius * Math.sin(controlAngle1);
                        const cx2 = centerX + controlRadius * Math.cos(controlAngle2);
                        const cy2 = centerY + controlRadius * Math.sin(controlAngle2);
                        if (j === 0)
                        {
                            ctx.moveTo(x1, y1);
                        }
                        else
                        {
                            ctx.lineTo(x1, y1);
                        }
                    }
                }
                else if (shapeType === 2)
                {
                    for (let j = 0; j < numSegments * 2; j++)
                    {
                        const angle = (j / (numSegments * 2)) * 2 * Math.PI;
                        const r = (j % 2 === 0) ? layerRadius : layerRadius * 0.5;
                        const x = centerX + r * Math.cos(angle);
                        const y = centerY + r * Math.sin(angle);
                        if (j === 0)
                        {
                            ctx.moveTo(x, y);
                        } 
                        else
                        {
                            ctx.lineTo(x, y);
                        }
                    }
                }
                else if (shapeType === 3)
                {
                    for (let j = 0; j < numSegments; j++)
                    {
                        const angle = (j / numSegments) * 2 * Math.PI;
                        const x1 = centerX + layerRadius * Math.cos(angle);
                        const y1 = centerY + layerRadius * Math.sin(angle);
                        const controlAngle1 = angle + (Math.PI / numSegments) * 0.8;
                        const controlRadius1 = layerRadius * 0.6;
                        const cx1 = centerX + controlRadius1 * Math.cos(controlAngle1);
                        const cy1 = centerY + controlRadius1 * Math.sin(controlAngle1);
                        const nextAngle = ((j + 1) / numSegments) * 2 * Math.PI;
                        const x2 = centerX + layerRadius * Math.cos(nextAngle);
                        const y2 = centerY + layerRadius * Math.sin(nextAngle);
                        if (j === 0)
                        {
                            ctx.moveTo(x1, y1);
                        }
                        ctx.quadraticCurveTo(cx1, cy1, x2, y2);
                    }
                }
                else if (shapeType === 4)
                {
                    for (let j = 0; j < numSegments; j++)
                    {
                        const angle = (j / numSegments) * 2 * Math.PI;
                        const x = centerX + layerRadius * Math.cos(angle);
                        const y = centerY + layerRadius * Math.sin(angle);
                        const innerAngle = angle + Math.PI / numSegments;
                        const innerRadius = layerRadius * 0.6;
                        const innerX = centerX + innerRadius * Math.cos(innerAngle);
                        const innerY = centerY + innerRadius * Math.sin(innerAngle);
                        if (j === 0)
                        {
                            ctx.moveTo(x, y);
                        }
                        else
                        {
                            ctx.lineTo(x, y);
                        }
                        ctx.lineTo(innerX, innerY);
                    }
                }
                ctx.closePath();
                ctx.stroke();
            }
        }
        function animate()
        {
            updateAmplitude();
            requestAnimationFrame(animate);
        }
        function equalize()
        {
            if (flatActive)
            {
                bassGain = 0;
                trebleGain = 0;
                videoElement.audioNodes.lGain.gain.value = 1.0;
                videoElement.audioNodes.mGain.gain.value = 1.0;
                videoElement.audioNodes.hGain.gain.value = 1.0;
            }
            if (bassActive)
            {
                bassGain = bassGain + 1.5;
                videoElement.audioNodes.lGain.gain.value = bassGain;
                videoElement.audioNodes.mGain.gain.value = 1.0;
                videoElement.audioNodes.hGain.gain.value = 1.0;
            }
            if (trebleActive)
            {
                trebleGain = trebleGain + 1.5;
                videoElement.audioNodes.lGain.gain.value = 1.0;
                videoElement.audioNodes.mGain.gain.value = 1.0;
                videoElement.audioNodes.hGain.gain.value = trebleGain;
            }
        }
        function panAudio()
        {
            const panner = videoElement.audioNodes.panner;
            if (!panner) return;
            let startTime = audioContext.currentTime;
            let endPanValue = panDirection === 1 ? 1 : -1;
            let panStep = (endPanValue - panValue) / panDurationInFrames;
            function smoothPan(timestamp)
            {
                if (panningActive)
                {
                    let elapsedTime = timestamp - lastTimestamp;
                    panValue += panStep;
                    panner.positionX.setValueAtTime(panValue, audioContext.currentTime);
                    if ((panDirection === 1 && panValue < 1) || (panDirection === -1 && panValue > -1))
                    {
                        lastTimestamp = timestamp;
                        requestAnimationFrame(smoothPan);
                    } else
                    {
                        panDirection = panDirection === 1 ? -1 : 1;
                        panValue = panDirection === 1 ? -1 : 1;
                        lastTimestamp = timestamp;
                        panAudio();
                    }
                }
            }
            lastTimestamp = performance.now();
            requestAnimationFrame(smoothPan);
        }
        function stopPanning()
        {
            const panner = videoElement.audioNodes.panner;
            if (panner) { panner.positionX.setValueAtTime(0, audioContext.currentTime); }
        }
        document.addEventListener('click', () => { if (audioContext.state === 'suspended') { audioContext.resume(); } });
        videoElement.addEventListener('ended', () =>
        {
            if (playAllActive)
            {
                if (currentIndex < videoSources.length - 1) 
                {
                    playVideo(currentIndex + 1);
                }
                else 
                {
                    playVideo(0);
                }
            }
            if (loopActive) 
            {
                playVideo(currentIndex);
            }
        });
        stopBtn.addEventListener('click', () =>
        {
            videoElement.src = videoSources[0];
            document.getElementById('timeDisplay').style.display = 'none';
            document.getElementById('loadingText').style.display = 'block';
            videoElement.pause();
            videoElement.currentTime = 0;
            resetVideo();
            playAllActive = false;
            loopActive = false;
            const checkVideoReady = setInterval(() =>
            {
                if (videoElement.readyState >= 4 && videoElement.buffered.length > 0 && videoElement.offsetParent !== null)
                {
                    clearInterval(checkVideoReady);
                    document.getElementById('loadingText').style.display = 'none';
                    document.getElementById('timeDisplay').style.display = 'block';
                }
            }, 1000);
            videoElement.style.display = 'block';
            videoElement.load();
            currentIndex = 0;
            videoSelector.value = currentIndex;
            seekbarProgress.style.left = "0%";
            flatActive = true;
            bassActive = false;
            trebleActive = false;
            panningActive = false;
            stopPanning();
            equalize();
        });
        panningBtn.addEventListener('click', () =>
        {
            panningActive = true;
            if (panningActive)
            {
                panDurationInFrames = panDurationInFrames - 10;
                if (panDurationInFrames < 10) { panDurationInFrames = 10 }
                panAudio();
            }
        });
        flatBtn.addEventListener('click', () =>
        {
            flatActive = true;
            bassActive = false;
            trebleActive = false;
            panningActive = false;
            stopPanning();
            equalize();
        });
        bassBtn.addEventListener('click', () =>
        {
            flatActive = false;
            bassActive = true;
            trebleActive = false;
            equalize();
        });
        trebleBtn.addEventListener('click', () =>
        {
            flatActive = false;
            bassActive = false;
            trebleActive = true;
            equalize();
        });
        loopBtn.addEventListener('click', () =>
        {
            loopActive = true;
            playAllActive = false;
            playVideo(currentIndex);
        });
        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { playVideo(currentIndex - 1); } });
        nextBtn.addEventListener('click', () => { if (currentIndex < videoSources.length - 1) { playVideo(currentIndex + 1); } });
        videoSelector.addEventListener('change', () => { const index = parseInt(videoSelector.value, 10); playVideo(index); });
        playAll.addEventListener('click', () => { playAllActive = true; playVideo(currentIndex); });
        playBtn.addEventListener('click', () => { videoElement.play(); });
        pauseBtn.addEventListener('click', () => { videoElement.pause(); });
        updateVideoSelector();
        window.addEventListener('load', () =>
        {
            playVideo(currentIndex);
            animate();
        });
        async function getAudioData(url)
        {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            const audioContext = new OfflineAudioContext({ numberOfChannels: 1, length: arrayBuffer.byteLength, sampleRate: 5000 });
            return (await audioContext.decodeAudioData(arrayBuffer)).getChannelData(0);
        }
        function downsample(data, targetSamples)
        {
            const step = data.length / targetSamples;
            return Float32Array.from({ length: targetSamples }, (_, i) => Math.abs(data[Math.floor(i * step)]));
        }
        function drawWaveform(data)
        {
            const canvas = document.getElementById('waveform-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const halfHeight = height / 2;
            const barWidth = width / data.length;
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'white';
            for (let i = 0; i < data.length; i++)
            {
                const barHeight = data[i] * halfHeight * 2;
                const barX = i * barWidth;
                const yTop = halfHeight - barHeight;
                const yBottom = halfHeight;
                ctx.fillRect(barX, yTop, barWidth, barHeight);
                ctx.fillRect(barX, yBottom, barWidth, barHeight);
            }
        }
        function adjustVideoSize()
        {
            const videoContainer = document.querySelector('.video-container');
            if (!videoContainer) return;
            const minSize = 500;
            const intrinsicSize = 500;
            const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            let safeAreaBottom = 0;
            try
            {
                safeAreaBottom = parseFloat(getComputedStyle(document.documentElement)
                    .getPropertyValue('--safe-area-inset-bottom')) || 0;
            } catch (e)
            {
                safeAreaBottom = 0;
            }
            const topOffset = videoContainer.getBoundingClientRect().top;
            const availableHeight = viewportHeight - topOffset - safeAreaBottom;
            let size = Math.min(availableHeight, intrinsicSize);
            size = Math.max(size, minSize);
            videoContainer.style.height = size + 'px';
            videoContainer.style.width = size + 'px';
        }
        window.addEventListener('load', adjustVideoSize);
        window.addEventListener('resize', adjustVideoSize);
        if (window.visualViewport)
        {
            window.visualViewport.addEventListener('resize', adjustVideoSize);
        }
    </script>
