    <script>
        const videoSources = [
            "wp-content/uploads/govha.mp4", "wp-content/uploads/tandav.mp4", "wp-content/uploads/madhur.mp4",
            "wp-content/uploads/apatat.mp4", "wp-content/uploads/ninurt.mp4", "wp-content/uploads/monoma.mp4",
            "wp-content/uploads/monowo.mp4", "wp-content/uploads/ozyma.mp4", "wp-content/uploads/marin.mp4",
            "wp-content/uploads/shipwre.mp4", "wp-content/uploads/hynile.mp4", "wp-content/uploads/ihavea.mp4",
            "wp-content/uploads/onlyfl.mp4", "wp-content/uploads/darkda.mp4", "wp-content/uploads/buildh.mp4",
            "wp-content/uploads/besifen.mp4", "wp-content/uploads/gilgen.mp4", "wp-content/uploads/inana.mp4",
            "wp-content/uploads/messag.mp4", "wp-content/uploads/drinki.mp4", "wp-content/uploads/deagil.mp4",
            "wp-content/uploads/harper.mp4", "wp-content/uploads/gayatr.mp4", "wp-content/uploads/nikkal.mp4",
            "wp-content/uploads/aaroha.mp4", "wp-content/uploads/adyay.mp4", "wp-content/uploads/adyayy.mp4",
            "wp-content/uploads/yuyut.mp4", "wp-content/uploads/abhim.mp4", "wp-content/uploads/ayas.mp4",
            "wp-content/uploads/avsh.mp4", "wp-content/uploads/sankh.mp4", "wp-content/uploads/nasd.mp4",
            "wp-content/uploads/yudh.mp4", "wp-content/uploads/brou.mp4", "wp-content/uploads/rifl.mp4",
            "wp-content/uploads/carv.mp4", "wp-content/uploads/apart.mp4", "wp-content/uploads/poten.mp4",
            "wp-content/uploads/crack.mp4", "wp-content/uploads/sands.mp4", "wp-content/uploads/drift.mp4",
            "wp-content/uploads/vile.mp4", "wp-content/uploads/river.mp4", "wp-content/uploads/falling.mp4",
            "wp-content/uploads/opposing.mp4", "wp-content/uploads/krishna.mp4", "wp-content/uploads/rain.mp4",
            "wp-content/uploads/ruins.mp4", "wp-content/uploads/lamen.mp4", "wp-content/uploads/ishta.mp4",
            "wp-content/uploads/krwa.mp4"
        ];
        const rawVideoNames = [
            "Govinda Hare Gopala Hare", "Shiva Tandav Stotra", "Madhurastakam", "Apatati", "Glory to Ninurta",
            "Monologue of a Man", "Monologue of a Woman", "Ozymandias", "Rime of the Ancient Mariner",
            "Story of the Shipwrecked Sailor", "Hymn to Nile", "I Have Arrived Here", "Only Flowers Are Our Adornment",
            "Dark Days of the Last Month", "Those Who Build Houses", "Beside the Fence Rails",
            "Gilgamesh, Enkidu and the Nether World", "The Balbale to Inana", "The Message of Lu-Digira to His Mother",
            "The Drinking Song", "Death of Gilgamesh", "Harpers Song", "Gayatri Mantra Extended", "Hymn to Nikkal",
            "Aarohanam", "Adyayajna", "Adyayajna 2", "Yuyutso", "Abhimanyu", "Ayaskantiya", "Avshishyate", "Sankhya",
            "Nasadiya Sukta", "Yudhishthir", "Brought To You By", "Rifle", "Carved", "Apart", "Potential Difference",
            "Cracks", "Sands", "Drift", "Vile", "Rivers Of Least Resistance", "Falling", "Opposite Poles", "Krishna",
            "Rain Down", "Ruins", "Lament of Ur", "Ishtar's Descent to the Underworld", "Kurukshetra"
        ];
        let currentIndex = 0;
        let playAllActive = false;
        let loopActive = false;
        let panningActive = false;
        let panDirection = 1;
        let panValue = 0;
        let panInterval;
        const waveformCache = {};
        const videoElement = document.querySelector('.video');
        const videoSelector = document.getElementById('videoSelector');
        const seekbar = document.getElementById('custom-seekbar');
        const seekbarProgress = document.getElementById('seekbarProgress');
        const timeDisplay = document.getElementById('timeDisplay');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const loadingText = document.getElementById('loadingText');
        const bgCanvas = document.getElementById("backgroundCanvas");
        const waveCanvas = document.getElementById("waveform-canvas");
        const bgCtx = bgCanvas.getContext("2d", { alpha: true });
        const waveCtx = waveCanvas.getContext("2d", { alpha: true });
        const AudioGraph = { ctx: null, source: null, analyser: null, lGain: null, mGain: null, hGain: null, panner: null, initialized: false };
        window.onload = () => {
            resizeCanvases();
            window.addEventListener('resize', resizeCanvases);
            updateVideoSelector();
            videoElement.src = videoSources[0];
            videoSelector.value = 0;
            generateWaveform(0);
            animateVisuals();
        };
        document.addEventListener('contextmenu', e => e.preventDefault());
        function resizeCanvases() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            waveCanvas.width = seekbar.offsetWidth;
            waveCanvas.height = seekbar.offsetHeight;
            if (waveformCache[currentIndex]) {
                drawWaveformFromCache(waveformCache[currentIndex]);
            }
        }
        function updateVideoSelector() {
            const fragment = document.createDocumentFragment();
            rawVideoNames.forEach((name, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${index + 1}. ${name}`;
                fragment.appendChild(option);
            });
            videoSelector.appendChild(fragment);
        }
        function initAudioContext() {
            if (AudioGraph.initialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            AudioGraph.ctx = new AudioContext();
            AudioGraph.source = AudioGraph.ctx.createMediaElementSource(videoElement);
            AudioGraph.analyser = AudioGraph.ctx.createAnalyser();
            AudioGraph.analyser.fftSize = 256;
            AudioGraph.panner = AudioGraph.ctx.createStereoPanner();
            const hBand = AudioGraph.ctx.createBiquadFilter(); hBand.type = "lowshelf"; hBand.frequency.value = 360; hBand.gain.value = 0;
            const lBand = AudioGraph.ctx.createBiquadFilter(); lBand.type = "highshelf"; lBand.frequency.value = 3600; lBand.gain.value = 0;
            AudioGraph.lGain = AudioGraph.ctx.createGain();
            AudioGraph.mGain = AudioGraph.ctx.createGain();
            AudioGraph.hGain = AudioGraph.ctx.createGain();
            AudioGraph.source.connect(hBand).connect(lBand);
            lBand.connect(AudioGraph.lGain);
            lBand.connect(AudioGraph.mGain);
            lBand.connect(AudioGraph.hGain);
            const sum = AudioGraph.ctx.createGain();
            AudioGraph.lGain.connect(sum);
            AudioGraph.mGain.connect(sum);
            AudioGraph.hGain.connect(sum);
            sum.connect(AudioGraph.panner).connect(AudioGraph.analyser).connect(AudioGraph.ctx.destination);
            AudioGraph.initialized = true;
        }
        function ensureAudioContext() {
            if (!AudioGraph.initialized) initAudioContext();
            if (AudioGraph.ctx.state === 'suspended') AudioGraph.ctx.resume();
        }
        async function generateWaveform(index) {
            if (waveformCache[index]) {
                drawWaveformFromCache(waveformCache[index]);
                return;
            }
            loadingText.style.display = 'block';
            timeDisplay.style.display = 'none';
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            try {
                const response = await fetch(videoSources[index]);
                const arrayBuffer = await response.arrayBuffer();
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
                const rawData = audioBuffer.getChannelData(0);
                const canvasWidth = waveCanvas.width;
                const step = Math.ceil(rawData.length / canvasWidth);
                const amp = canvasWidth / 2;
                const peaks = [];
                for (let i = 0; i < canvasWidth; i++) {
                    let min = 1.0;
                    let max = -1.0;
                    for (let j = 0; j < step; j++) {
                        const datum = rawData[(i * step) + j];
                        if (datum < min) min = datum;
                        if (datum > max) max = datum;
                    }
                    peaks.push([min, max]);
                }
                waveformCache[index] = peaks;
                drawWaveformFromCache(peaks);
                tempCtx.close();
            } catch (e) {
                console.error("Waveform generation failed", e);
            } finally {
                loadingText.style.display = 'none';
                timeDisplay.style.display = 'block';
            }
        }
        function drawWaveformFromCache(peaks) {
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            waveCtx.fillStyle = "#ffffff";
            const centerY = waveCanvas.height / 2;
            const scale = centerY * 0.9;
            for (let i = 0; i < peaks.length; i++) {
                const min = peaks[i][0];
                const max = peaks[i][1];
                const curve = 3;
                const minC = Math.sign(min) * Math.pow(Math.abs(min), curve);
                const maxC = Math.sign(max) * Math.pow(Math.abs(max), curve);
                const h = Math.max(1, (maxC - minC) * scale);
                waveCtx.fillRect(i, centerY - (h / 2), 1, h);
            }
        }
        async function playVideo(index) {
            ensureAudioContext();
            currentIndex = index;
            videoSelector.value = index;
            videoElement.src = videoSources[index];
            videoElement.load();
            generateWaveform(index);
            try {
                await videoElement.play();
            } catch (e) { console.log("Autoplay prevented"); }
        }
        videoElement.addEventListener('loadedmetadata', () => {
            const min = Math.floor(videoElement.duration / 60);
            const sec = Math.floor(videoElement.duration % 60);
            totalTimeEl.textContent = `${min < 10 ? '0' + min : min}:${sec < 10 ? '0' + sec : sec}`;
        });
        videoElement.addEventListener('timeupdate', () => {
            if (!videoElement.duration) return;
            const pct = (videoElement.currentTime / videoElement.duration) * 100;
            seekbarProgress.style.width = pct + "%";
            const min = Math.floor(videoElement.currentTime / 60);
            const sec = Math.floor(videoElement.currentTime % 60);
            currentTimeEl.textContent = `${min < 10 ? '0' + min : min}:${sec < 10 ? '0' + sec : sec}`;
        });
        videoElement.addEventListener('ended', () => {
            if (loopActive) { videoElement.play(); }
            else if (playAllActive) {
                const next = (currentIndex + 1) % videoSources.length;
                playVideo(next);
            }
        });
        seekbar.addEventListener('click', (e) => {
            const rect = seekbar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (videoElement.duration) {
                videoElement.currentTime = pos * videoElement.duration;
            }
        });
        videoSelector.addEventListener('change', (e) => playVideo(parseInt(e.target.value)));
        document.getElementById('playBtn').onclick = () => { ensureAudioContext(); videoElement.play(); };
        document.getElementById('pauseBtn').onclick = () => videoElement.pause();
        document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) playVideo(currentIndex - 1); };
        document.getElementById('nextBtn').onclick = () => { if (currentIndex < videoSources.length - 1) playVideo(currentIndex + 1); };
        document.getElementById('stopBtn').onclick = () => {
            videoElement.pause();
            videoElement.currentTime = 0;
            playAllActive = false; loopActive = false;
            seekbarProgress.style.width = "0%";
            resetEffects();
            toggleActive('flatBtn');
        };
        document.getElementById('playAll').onclick = function() {
            this.classList.toggle('active-state');
            playAllActive = !playAllActive;
            loopActive = false;
            document.getElementById('loopBtn').classList.remove('active-state');
            if (videoElement.paused) playVideo(currentIndex);
        };
        document.getElementById('loopBtn').onclick = function() {
            this.classList.toggle('active-state');
            loopActive = !loopActive;
            playAllActive = false;
            document.getElementById('playAll').classList.remove('active-state');
        };
        function toggleActive(id) {
            ['flatBtn', 'bassBtn', 'trebleBtn', 'panningBtn'].forEach(btn => document.getElementById(btn).classList.remove('active-state'));
            document.getElementById(id).classList.add('active-state');
        }
        function resetEffects() {
            if (!AudioGraph.initialized) return;
            panningActive = false;
            AudioGraph.panner.pan.value = 0;
            AudioGraph.lGain.gain.value = 1;
            AudioGraph.mGain.gain.value = 1;
            AudioGraph.hGain.gain.value = 1;
        }
        document.getElementById('flatBtn').onclick = () => { resetEffects(); toggleActive('flatBtn'); };
        document.getElementById('bassBtn').onclick = () => {
            resetEffects(); toggleActive('bassBtn');
            if (AudioGraph.initialized) AudioGraph.lGain.gain.value = 5;
        };
        document.getElementById('trebleBtn').onclick = () => {
            resetEffects(); toggleActive('trebleBtn');
            if (AudioGraph.initialized) AudioGraph.hGain.gain.value = 5;
        };
        document.getElementById('panningBtn').onclick = () => {
            toggleActive('panningBtn');
            panningActive = !panningActive;
            if (panningActive) { ensureAudioContext(); panLoop(); }
            else { if (AudioGraph.initialized) AudioGraph.panner.pan.value = 0; }
        };
        function panLoop() {
            if (!panningActive) return;
            panValue += 0.01 * panDirection;
            if (panValue > 0.8) panDirection = -1;
            if (panValue < -0.8) panDirection = 1;
            if (AudioGraph.initialized) AudioGraph.panner.pan.value = panValue;
            requestAnimationFrame(panLoop);
        }
        function animateVisuals() {
            requestAnimationFrame(animateVisuals);
            if (!AudioGraph.initialized || (typeof videoElement !== 'undefined' && videoElement.paused)) return;
            const bufferLength = AudioGraph.analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            AudioGraph.analyser.getByteFrequencyData(dataArray);
            let bassTotal = 0;
            let midTotal = 0;
            for (let i = 0; i < bufferLength; i++) {
                if (i < 5) bassTotal += dataArray[i];
                else if (i < 50) midTotal += dataArray[i];
            }
            const bassLevel = bassTotal / 5;
            const midLevel = midTotal / 45;
            let rawVolumeRatio = bassLevel / 255;
            const dynamicEnergy = Math.pow(rawVolumeRatio, 3);
            if (!bgCanvas.warpState) {
                bgCanvas.warpState = {
                    stars: [],
                    count: 50,
                    depth: 200
                };
                for (let i = 0; i < bgCanvas.warpState.count; i++) {
                    bgCanvas.warpState.stars.push({
                        x: (Math.random() - 0.5) * bgCanvas.width * 2,
                        y: (Math.random() - 0.5) * bgCanvas.height * 2,
                        z: Math.random() * bgCanvas.warpState.depth,
                        colorVal: Math.random()
                    });
                }
            }
            const cx = bgCanvas.width / 2;
            const cy = bgCanvas.height / 2;
            const time = performance.now() / 1000;
            const fadeAlpha = 0 + (0.8 * (1 - dynamicEnergy));
            bgCtx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.save();
            bgCtx.translate(cx, cy);
            const rotSpeed = 0.02 + (dynamicEnergy * 0.2);
            bgCtx.rotate(time * rotSpeed);
            if (dynamicEnergy > 0.1) {
                const shakeAmt = dynamicEnergy * 20;
                const shakeX = (Math.random() - 0.5) * shakeAmt;
                const shakeY = (Math.random() - 0.5) * shakeAmt;
                bgCtx.translate(shakeX, shakeY);
            }
            const speed = 0.5 + (dynamicEnergy * 10);
            bgCanvas.warpState.stars.forEach(star => {
                star.z -= speed;
                if (star.z <= 0) {
                    star.z = bgCanvas.warpState.depth;
                    star.x = (Math.random() - 0.5) * bgCanvas.width * 2;
                    star.y = (Math.random() - 0.5) * bgCanvas.height * 2;
                    if (Math.abs(star.x) < 50 && Math.abs(star.y) < 50) star.x += 100;
                }
                const k = 128.0 / star.z;
                const px = star.x * k;
                const py = star.y * k;
                const tailLength = speed * (0.5 + dynamicEnergy);
                const prevZ = star.z + tailLength;
                const prevK = 128.0 / prevZ;
                const prevPx = star.x * prevK;
                const prevPy = star.y * prevK;
                const distanceFade = 1 - (star.z / bgCanvas.warpState.depth);
                const size = (1 - distanceFade) * (1 + dynamicEnergy * 4);
                const hue = (time * 20) + (star.colorVal * 60) + (midLevel * 0.2);
                const lightness = 30 + (dynamicEnergy * 60);
                bgCtx.lineWidth = size;
                bgCtx.lineCap = 'round';
                bgCtx.strokeStyle = `hsla(${hue}, 80%, ${lightness}%, ${distanceFade})`;
                bgCtx.beginPath();
                bgCtx.moveTo(prevPx, prevPy);
                bgCtx.lineTo(px, py);
                bgCtx.stroke();
            });
            bgCtx.globalCompositeOperation = 'source-over';
            bgCtx.restore();
        }
    </script>
</body>
