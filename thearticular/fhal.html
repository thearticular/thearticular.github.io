  <style>

<body class="singular">
  <main class="site-main">
    <article class="hentry entry">
      <header class="entry-header responsive-max-width">
        <h1 class="entry-title">Find Elevation
          <footer>thearticular.github.io © 2025 and all its content are licensed under CC BY-NC-ND 4.0.
          </footer>
        </h1>
      </header>
      <div class="entry-content">
        <div class="wp-block-buttons">
          <div
            class="wp-block-button has-custom-width wp-block-button__width-100 has-custom-font-size is-style-outline has-small-font-size">
            <a class="wp-block-button__link has-background-color has-foreground-background-color has-text-color has-background has-link-color wp-element-button"
              href="../index.html">Homepage</a>
          </div>
        </div>
        <div class="form-group">
          <label for="centerCoord">Center Coordinate (Latitude, Longitude, You can
            directly copy past form Google Maps)</label>
          <input type="text"
            id="centerCoord"
            placeholder="27.987689311331227, 86.9253211052665" />
        </div>
        <div class="form-group">
          <label for="radius">Radius (Meters, 1 to 100000)</label>
          <input type="number"
            id="radius"
            placeholder="10000"
            min="1"
            max="100000" />
        </div>
        <label>Optional Settings</label>
        <div class="form-group">
          <label for="iterations">Refinement Iterations (1 to 10)</label>
          <input type="number"
            id="iterations"
            placeholder="8"
            min="1"
            max="10" />
        </div>
        <div class="form-group">
          <label for="initGridSpacing">Initial Grid Spacing (Radius/20, 0.1 to 5000)</label>
          <input type="number"
            id="initGridSpacing"
            placeholder="Radius/20"
            min="0.1"
            max="5000"
            step="0.1" />
        </div>
        <div class="form-group">
          <label for="refinementFactor">Grid Refinement Factor (2 to 10)</label>
          <input type="number"
            id="refinementFactor"
            placeholder="5"
            min="2"
            max="10"
            step="0.1" />
        </div>
        <div class="form-group">
          <label for="localSearchMultiplier">Local Search Radius Multiplier (1 to 10)</label>
          <input type="number"
            id="localSearchMultiplier"
            placeholder="2"
            min="1"
            max="10"
            step="0.1" />
        </div>
        <div class="form-group">
          <label for="batchSize">API Batch Size (1 to 200)</label>
          <input type="number"
            id="batchSize"
            placeholder="100"
            min="1"
            max="200" />
        </div>
        <button id="findButton"><label>Find Highest Elevation</label></button>
        <button id="findLowestButton"><label>Find Lowest Elevation</label></button>
        <div class="result"
          id="result"></div>
      </div>
    </article>
  </main>
  <script>
    const EARTH_RADIUS = 6371000;
    function toRadians(degrees)
    {
      return degrees * Math.PI / 180;
    }
    function haversineDistance(lat1, lon1, lat2, lon2)
    {
      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRadians(lat1)) *
        Math.cos(toRadians(lat2)) *
        Math.sin(dLon / 2) ** 2;
      return 2 * EARTH_RADIUS * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    async function fetchElevations(points, batchSize)
    {
      const results = [];
      for (let i = 0; i < points.length; i += batchSize)
      {
        const batch = points.slice(i, i + batchSize);
        const locationsParam = batch.map(pt => `${ pt.lat },${ pt.lon }`).join("|");
        const url = `https://api.open-elevation.com/api/v1/lookup?locations=${ encodeURIComponent(locationsParam) }`;
        try
        {
          const response = await fetch(url);
          if (!response.ok)
          {
            const errorMessage = `HTTP Error ${ response.status }: ${ response.statusText }`;
            throw new Error(errorMessage);
          }
          const data = await response.json();
          if (data && data.results)
          {
            results.push(...data.results);
          }
        } catch (error)
        {
          console.error("Error fetching elevation data:", error);
          document.getElementById("result").innerHTML = `
        <p style="color: red;">
          <strong>Elevation API Request Failed</strong><br>
          ${ error.message } <br>
          Please check your network connection or try again later.
        </p>`;
          return null;
        }
      }
      return results;
    }
    function generateGrid(centerLat, centerLon, radius, spacing)
    {
      const points = [];
      const latRadius = radius / 111320;
      const lonRadius = radius / (111320 * Math.cos(toRadians(centerLat)));
      const latStep = spacing / 111320;
      const lonStep = spacing / (111320 * Math.cos(toRadians(centerLat)));
      for (let lat = centerLat - latRadius; lat <= centerLat + latRadius; lat += latStep)
      {
        for (let lon = centerLon - lonRadius; lon <= centerLon + lonRadius; lon += lonStep)
        {
          if (haversineDistance(centerLat, centerLon, lat, lon) <= radius)
          {
            points.push({ lat, lon });
          }
        }
      }
      return points;
    }
    async function findHighestAltitude(centerLat, centerLon, radius, iterations, spacing, refinement, searchMultiplier, batchSize)
    {
      let highestPoint = null;
      let highestElevation = -Infinity;
      let searchCenter = { lat: centerLat, lon: centerLon };
      let searchRadius = radius;
      let gridSpacing = spacing;
      for (let i = 0; i < iterations; i++)
      {
        const gridPoints = generateGrid(searchCenter.lat, searchCenter.lon, searchRadius, gridSpacing);
        if (gridPoints.length === 0) break;
        const elevations = await fetchElevations(gridPoints, batchSize);
        if (!elevations)
        {
          return null;
        }
        for (const pt of elevations)
        {
          if (typeof pt.elevation === "number" && pt.elevation > highestElevation)
          {
            highestElevation = pt.elevation;
            highestPoint = { lat: pt.latitude, lon: pt.longitude };
          }
        }
        if (!highestPoint) break;
        searchCenter = highestPoint;
        searchRadius = gridSpacing * searchMultiplier;
        gridSpacing /= refinement;
      }
      return highestPoint ? { ...highestPoint, elevation: highestElevation } : null;
    }
    async function findLowestAltitude(centerLat, centerLon, radius, iterations, spacing, refinement, searchMultiplier, batchSize)
    {
      let lowestPoint = null;
      let lowestElevation = Infinity;
      let searchCenter = { lat: centerLat, lon: centerLon };
      let searchRadius = radius;
      let gridSpacing = spacing;
      for (let i = 0; i < iterations; i++)
      {
        const gridPoints = generateGrid(searchCenter.lat, searchCenter.lon, searchRadius, gridSpacing);
        if (gridPoints.length === 0) break;
        const elevations = await fetchElevations(gridPoints, batchSize);
        if (!elevations)
        {
          return null;
        }
        for (const pt of elevations)
        {
          if (typeof pt.elevation === "number" && pt.elevation < lowestElevation)
          {
            lowestElevation = pt.elevation;
            lowestPoint = { lat: pt.latitude, lon: pt.longitude };
          }
        }
        if (!lowestPoint) break;
        searchCenter = lowestPoint;
        searchRadius = gridSpacing * searchMultiplier;
        gridSpacing /= refinement;
      }
      return lowestPoint ? { ...lowestPoint, elevation: lowestElevation } : null;
    }
    function parseCoordinateInput(inputStr)
    {
      if (!inputStr || typeof inputStr !== "string") return null;
      const parts = inputStr.split(",");
      if (parts.length !== 2) return null;
      const lat = Number(parts[0].trim());
      const lon = Number(parts[1].trim());
      if (isNaN(lat) || isNaN(lon)) return null;
      return { lat, lon };
    }
    function getValidatedInput(id, defaultValue, validatorFn, errorMessages, errorMsg)
    {
      const inputElem = document.getElementById(id);
      let value = inputElem.value.trim();
      if (value === "" || (validatorFn && !validatorFn(value)))
      {
        errorMessages.push(`${ errorMsg } Using default ${ defaultValue }.`);
        inputElem.value = "";
        return Number(defaultValue);
      }
      return Number(value);
    }
    document.getElementById("findButton").addEventListener("click", async () =>
    {
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `<p>Processing, please wait.</p>`;
      const errorMessages = [];
      const coordInput = document.getElementById("centerCoord").value.trim();
      let center = parseCoordinateInput(coordInput);
      const defaultCenterStr = "27.987689311331227, 86.9253211052665";
      if (!center)
      {
        errorMessages.push(`Invalid coordinate, using default 27.987689311331227, 86.9253211052665.`);
        center = parseCoordinateInput(defaultCenterStr);
        document.getElementById("centerCoord").value = "";
      }
      const radiusInput = document.getElementById("radius").value.trim();
      let radius = Number(radiusInput);
      if (isNaN(radius) || radius < 1 || radius > 100000)
      {
        errorMessages.push(`Invalid radius, using default 10000m.`);
        radius = 10000;
        document.getElementById("radius").value = "";
      }
      const iterations = getValidatedInput(
        "iterations",
        "8",
        (v) => !isNaN(v) && Number(v) >= 1 && Number(v) <= 10,
        errorMessages,
        "Invalid iterations, using default 8."
      );
      let initGridSpacingInput = document.getElementById("initGridSpacing").value.trim();
      let spacing;
      if (initGridSpacingInput === "" || isNaN(initGridSpacingInput))
      {
        spacing = radius / 20;
      }
      else
      {
        spacing = Number(initGridSpacingInput);
        if (spacing < 0.1 || spacing > 5000)
        {
          errorMessages.push(`Invalid grid spacing, using default (Radius/20).`);
          spacing = radius / 20;
          document.getElementById("initGridSpacing").value = "";
        }
      }
      const refinement = getValidatedInput(
        "refinementFactor",
        "5",
        (v) => !isNaN(v) && Number(v) >= 2 && Number(v) <= 10,
        errorMessages,
        "Invalid grid refinement, using default 5."
      );
      const searchMultiplier = getValidatedInput(
        "localSearchMultiplier",
        "2",
        (v) => !isNaN(v) && Number(v) >= 1 && Number(v) <= 10,
        errorMessages,
        "Invalid local search multiplier, using default 2."
      );
      const batchSize = getValidatedInput(
        "batchSize",
        "100",
        (v) => !isNaN(v) && Number(v) >= 1 && Number(v) <= 200,
        errorMessages,
        "Invalid API batch size, using default 100."
      );
      try
      {
        const highest = await findHighestAltitude(
          center.lat,
          center.lon,
          radius,
          iterations,
          spacing,
          refinement,
          searchMultiplier,
          batchSize
        );
        if (highest)
        {
          let output = `Coordinate: ${ highest.lat }, ${ highest.lon }, Elevation: ${ highest.elevation }m`;
          if (errorMessages.length > 0)
          {
            output += `<div class="message">Note: ${ errorMessages.join(" ") }</div>`;
          }
          resultDiv.innerHTML = output;
        }
        else
        {
          resultDiv.innerHTML = `<p>No result found.</p>`;
        }
      }
      catch (error)
      {
        console.error("An error occurred", error);
        resultDiv.innerHTML = `<p>An unexpected error occurred.</p>`;
      }
    });
    async function findLowestAltitude(centerLat, centerLon, radius, iterations, spacing, refinement, searchMultiplier, batchSize)
    {
      let lowestPoint = null;
      let lowestElevation = Infinity;
      let searchCenter = { lat: centerLat, lon: centerLon };
      let searchRadius = radius;
      let gridSpacing = spacing;
      for (let i = 0; i < iterations; i++)
      {
        const gridPoints = generateGrid(searchCenter.lat, searchCenter.lon, searchRadius, gridSpacing);
        if (gridPoints.length === 0) break;
        const elevations = await fetchElevations(gridPoints, batchSize);
        if (!elevations)
        {
          return null;
        }
        for (const pt of elevations)
        {
          if (typeof pt.elevation === "number" && pt.elevation < lowestElevation)
          {
            lowestElevation = pt.elevation;
            lowestPoint = { lat: pt.latitude, lon: pt.longitude };
          }
        }
        if (!lowestPoint) break;

        searchCenter = lowestPoint;
        searchRadius = gridSpacing * searchMultiplier;
        gridSpacing /= refinement;
      }
      return lowestPoint ? { ...lowestPoint, elevation: lowestElevation } : null;
    }
    document.getElementById("findLowestButton").addEventListener("click", async () =>
    {
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `<p>Processing, please wait.</p>`;
      const coordInput = document.getElementById("centerCoord").value.trim();
      let center = parseCoordinateInput(coordInput) || parseCoordinateInput("27.987689311331227, 86.9253211052665");
      const radius = getValidatedInput("radius", "10000", (v) => !isNaN(v) && Number(v) >= 1 && Number(v) <= 100000, [], "");
      const iterations = getValidatedInput("iterations", "8", (v) => !isNaN(v) && Number(v) >= 1 && Number(v) <= 10, [], "");
      const spacing = getValidatedInput("initGridSpacing", (radius / 20).toString(), (v) => !isNaN(v) && Number(v) >= 0.1 && Number(v) <= 5000, [], "");
      const refinement = getValidatedInput("refinementFactor", "5", (v) => !isNaN(v) && Number(v) >= 2 && Number(v) <= 10, [], "");
      const searchMultiplier = getValidatedInput("localSearchMultiplier", "2", (v) => !isNaN(v) && Number(v) >= 1 && Number(v) <= 10, [], "");
      const batchSize = getValidatedInput("batchSize", "100", (v) => !isNaN(v) && Number(v) >= 1 && Number(v) <= 200, [], "");
      try
      {
        const lowest = await findLowestAltitude(
          center.lat,
          center.lon,
          radius,
          iterations,
          spacing,
          refinement,
          searchMultiplier,
          batchSize
        );
        if (lowest)
        {
          resultDiv.innerHTML = `Lowest Altitude Coordinate: ${ lowest.lat }, ${ lowest.lon }, Elevation: ${ lowest.elevation }m`;
        } else
        {
          resultDiv.innerHTML = `<p>No result found.</p>`;
        }
      } catch (error)
      {
        console.error("An error occurred", error);
        resultDiv.innerHTML = `<p>An unexpected error occurred.</p>`;
      }
    });
  </script>
